
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAM Login Demo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eef2ff;
    }

    .card {
      background: white;
      width: min(360px, 90%);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 28px #00000015;
    }

    h1 { margin-top: 0; color: #1e293b; }
    p { color: #64748b; }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 15px;
    }

    input { border: 1px solid #cbd5e1; }

    button {
      border: 0;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    #result {
      overflow-wrap: anywhere;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Login Demo</h1>
    <p>Testing an AWS SAM backend endpoint</p>

    <form id="loginForm">
      <input id="username" name="username"
             placeholder="Username" required>
      <input id="password" name="password"
             type="password" placeholder="Password" required>
      <button id="submitButton" type="submit">Test Login API</button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    const API_URL =
      "https://tm3xic7ps0.execute-api.us-east-1.amazonaws.com/login";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      result.textContent = "Calling the API...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();
        result.textContent = data.message || "Request completed.";
      } catch (error) {
        result.textContent =
          "Request failed. Check the API URL and CORS settings.";
        console.error(error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
